<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Navi</title>
    <link rel="stylesheet" href="shared.css" />
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <header class="top">
      <div class="brand">
        <img src="icons/icon32.png" alt="" width="22" height="22" />
        <h1>Navi</h1>
      </div>
      <div id="status" class="status" data-state="off" role="status" aria-live="polite">
        <span class="dot" aria-hidden="true"></span><span id="status-text">Mic off</span>
      </div>
    </header>

    <div id="mic-banner" class="banner" hidden>
      <p>Navi needs microphone access once.</p>
      <button id="open-setup" class="primary">Set up microphone</button>
    </div>
    <div id="key-banner" class="banner subtle" hidden>
      <p>Basic commands work now. Add an AI API key (Claude or OpenAI) in <a href="#" id="open-settings-inline">settings</a> for smart commands.</p>
    </div>

    <section id="voice" class="voice" data-state="off" aria-label="Microphone">
      <div class="voice-main">
        <button id="mic" class="mic" aria-pressed="false" aria-label="Start listening">
          <span class="mic-halo" aria-hidden="true"></span>
          <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true">
            <path fill="currentColor" d="M12 14a3 3 0 0 0 3-3V5a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2Z"/>
          </svg>
        </button>
        <div class="caption">
          <span class="bars" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>
          <!-- What the recognizer is hearing right now (the log gets the final command). -->
          <p id="interim" class="interim" aria-hidden="true"></p>
          <p id="caption-hint" class="caption-hint">Tap the mic to talk, or type a command below.</p>
        </div>
        <div id="session-bar" class="session-bar" hidden><div></div></div>
      </div>
      <fieldset class="mode">
        <legend class="sr-only">Listening mode</legend>
        <div class="segmented">
          <label>
            <input type="radio" name="mode" value="handsfree" aria-describedby="hint-handsfree" />
            <span>Hey <span class="wake-name">Navi</span></span>
          </label>
          <label>
            <input type="radio" name="mode" value="open" aria-describedby="hint-open" />
            <span>Open mic</span>
          </label>
        </div>
        <p id="hint-handsfree" class="mode-hint" data-mode="handsfree">Say “Hey <span class="wake-name">Navi</span>”, then talk.</p>
        <p id="hint-open" class="mode-hint" data-mode="open">Everything is a command until you turn the mic off.</p>
      </fieldset>
    </section>

    <ol id="log" class="feed" aria-label="Activity"></ol>
    <!-- Screen readers hear Navi's replies and errors, not every step. -->
    <div id="announcer" class="sr-only" aria-live="polite" aria-relevant="additions"></div>

    <form id="command-form" class="composer">
      <input id="command-input" type="text" placeholder="Type a command…" autocomplete="off" aria-label="Command" />
      <button type="submit" aria-label="Go">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <path d="M5 12h13M12.5 6 18.5 12l-6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </form>

    <footer class="toolbar">
      <button id="toggle-numbers" class="tool">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
          <path d="M5 21V4.5M5 4.5h11.5l-2 4 2 4H5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="label">Flags</span>
      </button>
      <button id="toggle-grid" class="tool">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
          <path d="M4 4h16v16H4zM9.33 4v16M14.67 4v16M4 9.33h16M4 14.67h16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
        </svg>
        <span class="label">Grid</span>
      </button>
      <span class="spacer"></span>
      <button id="help" class="tool">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
          <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.8"/>
          <path d="M9.6 9.4a2.5 2.5 0 1 1 3.4 2.3c-.6.3-1 .8-1 1.5v.4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          <circle cx="12" cy="16.9" r="1.1" fill="currentColor"/>
        </svg>
        <span class="label">Help</span>
      </button>
      <button id="open-settings" class="tool">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
          <path d="M4 7h9M17 7h3M4 17h3M11 17h9" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          <circle cx="15" cy="7" r="2.2" fill="none" stroke="currentColor" stroke-width="1.8"/>
          <circle cx="9" cy="17" r="2.2" fill="none" stroke="currentColor" stroke-width="1.8"/>
        </svg>
        <span class="label">Settings</span>
      </button>
    </footer>

    <p id="dev-status" class="dev-status" hidden></p>
    <script src="sidepanel.js"></script>
  </body>
</html>
